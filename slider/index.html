<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Slider</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="slider-container">
        <button class="slider-arrow slider-prev" id="prevBtn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </button>

        <div class="slider-wrapper">
            <div class="slider-track" id="sliderTrack">
                <div class="slide">
                    <img src="img/Type=01.png" alt="Slide 1">
                </div>
                <div class="slide">
                    <img src="img/Type=02.png" alt="Slide 2">
                </div>
                <div class="slide">
                    <img src="img/Type=03.png" alt="Slide 3">
                </div>
                <div class="slide">
                    <img src="img/Type=04.png" alt="Slide 4">
                </div>
                <div class="slide">
                    <img src="img/Type=05.png" alt="Slide 5">
                </div>
                <div class="slide">
                    <img src="img/Type=06.png" alt="Slide 6">
                </div>
            </div>
        </div>

        <button class="slider-arrow slider-next" id="nextBtn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
        </button>
    </div>

    <div class="slider-dots" id="sliderDots"></div>

    <script src="script.js"></script>
</body>
</html>
